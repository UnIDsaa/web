<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카모카테 체크리스트</title>
    <!-- PapaParse CDN for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="lang-both"> <!-- Default language view: both -->
    <header class="app-header">
        <div class="header-title">
            <h1>카모카테 이벤트/엔딩 체크리스트</h1>
        </div>
        <div class="header-controls">
            <button id="btn-toggle-lang" class="btn">언어: 함께 보기</button>
            <button id="btn-toggle-theme" class="btn">테마: 라이트(Light)</button>
        </div>
    </header>

    <div class="app-toolbar">
        <div class="data-controls">
            <button id="btn-export" class="btn btn-primary">데이터 내보내기</button>
            <input type="file" id="input-import" accept=".json" style="display: none;">
            <button id="btn-import" class="btn btn-secondary">데이터 불러오기</button>
            <button id="btn-clear-all" class="btn btn-danger">모든 데이터 초기화</button>
            
            <!-- Developer tools -->
            <button id="btn-dev-export-all-csv" class="btn btn-secondary dev-tool" style="display: none;">[Dev] 전체 CSV 내보내기</button>
            <button id="btn-dev-export-unchecked-csv" class="btn btn-secondary dev-tool" style="display: none;">[Dev] 미회수 CSV 내보내기</button>
        </div>
        <div class="filter-controls">
            <label style="margin-right: 1rem; font-size: 0.9rem; cursor: pointer;">
                <input type="checkbox" id="check-unchecked-only"> 미회수 항목만 보기
            </label>
            <input type="text" id="input-search" placeholder="이벤트명 또는 조건 검색..." class="search-input">
        </div>
    </div>

    <main class="app-container">
        <aside class="sidebar" id="character-list">
            <!-- Character Tabs will be rendered here -->
        </aside>

        <section class="content-area">
            <div class="content-header">
                <div>
                    <h2 id="current-character-name">캐릭터를 선택하세요</h2>
                    <div id="progress-stats" style="display: none; font-size: 0.95rem; color: var(--text-muted); margin-top: 0.5rem; font-weight: bold;">
                        이벤트: <span id="event-progress" style="color: var(--primary-color);">0/0 (0%)</span> | 
                        엔딩: <span id="ending-progress" style="color: var(--primary-color);">0/0 (0%)</span>
                    </div>
                </div>
                <div class="bulk-actions" style="display: none;">
                    <button id="btn-check-all" class="btn btn-sm">현재 탭 전체 선택</button>
                    <button id="btn-uncheck-all" class="btn btn-sm">현재 탭 전체 해제</button>
                </div>
            </div>

            <div class="view-tabs" style="display: none;">
                <button class="tab-btn active" data-target="events">이벤트</button>
                <button class="tab-btn" data-target="endings">엔딩</button>
            </div>

            <div id="list-container" class="list-container">
                <div id="events-view" class="view-pane active">
                    <!-- Events will be rendered here -->
                    <div class="placeholder-text">왼쪽에서 캐릭터를 선택해주세요.</div>
                </div>
                <div id="endings-view" class="view-pane">
                    <!-- Endings will be rendered here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modules Loading -->
    <script src="js/stateManager.js"></script>
    <script src="js/dataParser.js"></script>
    <script src="js/uiRender.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
